<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackbox 3D Replay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
        #app { position: relative; width: 100%; height: 100%; }
        canvas { display: block; }
        #toolbar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            background: rgba(20, 24, 30, 0.82); color: #eee;
            padding: 8px 12px; border-radius: 8px; z-index: 10;
        }
        #toolbar button, #toolbar label {
            background: #2db0e3; color: #fff; border: none; padding: 6px 12px;
            border-radius: 5px; cursor: pointer; font-size: 13px;
        }
        #toolbar button:hover { background: #1e8fc0; }
        #toolbar .sep { width: 1px; height: 22px; background: #444; }
        #status { font-size: 12px; color: #9fb3c8; }
        #seekWrap {
            position: absolute; bottom: 14px; left: 10px; right: 10px;
            background: rgba(20, 24, 30, 0.82); padding: 8px 12px; border-radius: 8px;
            display: flex; gap: 10px; align-items: center; z-index: 10; color: #eee;
        }
        #seek { flex: 1; }
        #timeLabel { font-size: 12px; min-width: 90px; text-align: right; color: #9fb3c8; }
        #drop {
            position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); color: #fff; font-size: 20px; z-index: 20; pointer-events: none;
        }
        #hud {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            background: rgba(20, 24, 30, 0.82); color: #cfe8ff; padding: 8px 12px; border-radius: 8px;
            font-size: 12px; line-height: 1.6; font-family: ui-monospace, monospace;
        }
        #hud span { color: #ffd166; font-weight: 700; }
    </style>
</head>
<body>
<div id="app">
    <div id="toolbar">
        <label>CSV Open
            <input type="file" id="fileInput" accept=".csv" style="display:none" />
        </label>
        <button id="playBtn">▶ Play</button>
        <button id="resetViewBtn">↺ Reset View</button>
        <button id="fullScreenBtn">⛶ Full Screen</button>
        <div class="sep"></div>
        <button id="yawBtn">↻ Heading 90°</button>
        <span id="status">Open a CSV file</span>
    </div>

    <div id="seekWrap">
        <button id="playBtn2">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" />
        <span id="timeLabel">0.0s</span>
    </div>

    <div id="drop">Drop a CSV file here</div>
    <div id="hud">
        <div>Altitude (relative): <span id="hudAltRel">0.0</span> m</div>
        <div>Altitude (ASL): <span id="hudAltAsl">0.0</span> m</div>
        <div>Raw ASL: <span id="hudRaw">0</span> / Home: <span id="hudHome">0</span></div>
        <div>Position: <span id="hudPos">0, 0</span></div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

// ---------------------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------------------
const app = document.getElementById("app");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9e6); // sky
scene.fog = new THREE.Fog(0x87b9e6, 60, 400);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
const CAM_HOME = new THREE.Vector3(0, 25, 55);
camera.position.copy(CAM_HOME);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.autoClear = true;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);
let camTargetY = 2; // smoothed camera target height (decoupled from plane jitter)

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(50, 100, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
scene.add(sun);

// ---------------------------------------------------------------------------
// Environment: field, runway, trees, flowers
// ---------------------------------------------------------------------------
const GROUND_SIZE = 600;
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE),
    new THREE.MeshStandardMaterial({ color: 0x5a9e3f })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Runway (asphalt strip)
const runway = new THREE.Mesh(
    new THREE.BoxGeometry(12, 0.2, 160),
    new THREE.MeshStandardMaterial({ color: 0x33363b })
);
runway.position.set(0, 0.1, 0);
runway.receiveShadow = true;
scene.add(runway);
// runway center line
for (let z = -70; z <= 70; z += 14) {
    const dash = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.05, 5),
        new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    dash.position.set(0, 0.22, z);
    scene.add(dash);
}

// Random trees & flowers
function rand(a, b) { return a + Math.random() * (b - a); }
const treeGroup = new THREE.Group();
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f7d32 });
for (let i = 0; i < 80; i++) {
    const x = rand(-280, 280), z = rand(-280, 280);
    if (Math.abs(x) < 18 && Math.abs(z) < 175) continue; // keep off runway
    const t = new THREE.Group();
    const h = rand(7, 10); // ~10m trees (1 unit = 1m)
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, h, 6), trunkMat);
    trunk.position.y = h / 2; trunk.castShadow = true;
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(rand(2.2, 3.6), 8, 6), leafMat);
    leaves.position.y = h + 1.2; leaves.castShadow = true;
    t.add(trunk); t.add(leaves);
    t.position.set(x, 0, z);
    treeGroup.add(t);
}
scene.add(treeGroup);

// Flowers
const flowerColors = [0xff5d8f, 0xffd166, 0x9b5de5, 0xffffff, 0xf15bb5];
const flowerGeo = new THREE.SphereGeometry(0.35, 6, 5);
for (let i = 0; i < 240; i++) {
    const x = rand(-290, 290), z = rand(-290, 290);
    if (Math.abs(x) < 14 && Math.abs(z) < 170) continue;
    const f = new THREE.Mesh(flowerGeo, new THREE.MeshStandardMaterial({
        color: flowerColors[(Math.random() * flowerColors.length) | 0]
    }));
    f.position.set(x, 0.35, z);
    scene.add(f);
}

// ---------------------------------------------------------------------------
// Airplane (loaded from inlined gltf) — reloaded on every file load so a
// previous model/state can never leak into the next replay.
// ---------------------------------------------------------------------------
let airplane = null;          // gltf.scene root
let propellers = [];          // propeller nodes (Cylinder_*)
let propAngle = 0;
let lastTs = 0;
let yawOffset = Math.PI / 2; // user-adjustable heading compensation (radians, +90° per click)
const loader = new GLTFLoader();

function loadAirplane() {
    // Remove any previously loaded model so it can't accumulate/leak.
    if (airplane) {
        scene.remove(airplane);
        airplane.traverse((o) => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) o.material.dispose();
        });
    }
    airplane = null;
    propellers = [];

    const b64 = AIRPLANE_GLTF_BASE64;
    const gltfDataUri = "data:model/gltf+json;base64," + b64;
    loader.load(gltfDataUri, (gltf) => {
        airplane = gltf.scene;
        airplane.scale.set(0.75, 0.75, 0.75);
        airplane.traverse((o) => {
            if (o.isMesh) { o.castShadow = true; }
            const name = (o.name || "").toLowerCase();
            if (/^cylinder/.test(name)) propellers.push(o);
        });
        // lift slightly so it sits above ground when stationary
        airplane.position.y = 4;
        scene.add(airplane);
        console.log("airplane loaded; propellers:", propellers.map((p) => p.name));
    }, undefined, (err) => {
        console.error("airplane load failed", err);
        document.getElementById("status").textContent = "Failed to load airplane model";
    });
}

// ---------------------------------------------------------------------------
// Waypoint / rescue markers (WP: yellow number, A/B: red letter)
// ---------------------------------------------------------------------------
let markersGroup = null;

// Make a camera-facing text sprite. heightM ~ world height in meters (field scale).
function makeTextSprite(text, color, heightM) {
    const pad = 24;
    const fontPx = 96;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.font = `bold ${fontPx}px system-ui, sans-serif`;
    const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
    const h = fontPx + pad * 2;
    canvas.width = w; canvas.height = h;
    ctx.font = `bold ${fontPx}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineWidth = 10;
    ctx.strokeStyle = "rgba(0,0,0,0.85)";
    ctx.strokeText(text, w / 2, h / 2);
    ctx.fillStyle = color;
    ctx.fillText(text, w / 2, h / 2);

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = 4;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true });
    const sprite = new THREE.Sprite(mat);
    const aspect = w / h;
    sprite.scale.set(heightM * aspect, heightM, 1);
    return sprite;
}

function clearMarkers() {
    if (markersGroup) {
        scene.remove(markersGroup);
        markersGroup.traverse((o) => {
            if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
            if (o.geometry) o.geometry.dispose();
        });
    }
    markersGroup = new THREE.Group();
    scene.add(markersGroup);
}

// lat/lon in degrees -> meters relative to home (matches buildFrames projection)
function degToMeters(lat, lon) {
    const dLat = (lat - homeLat) * 111320;
    const dLon = (lon - homeLon) * 111320 * Math.cos((homeLat * Math.PI) / 180);
    return { x: dLon, z: -dLat };
}

// Build WP (0..14) and A/B markers from the raw parsed rows.
// WP are static (fixed target altitude). A/B are dynamic: they first appear
// when the log starts reporting them, then their altitude tracks the live
// GPS rescue altitude every frame.
let abMarker = { a: null, b: null };   // { sprite, latDeg, lonDeg, altIdx }
let abFirstSeen = { a: null, b: null };

function buildMarkers(data) {
    clearMarkers();
    abMarker = { a: null, b: null };
    abFirstSeen = { a: null, b: null };
    const { out, wpLat, wpLon, wpAlt, iALat, iALon, iAAlt, iBLat, iBLon, iBAlt } = data;
    const num = (vals, k) => {
        if (k < 0) return null;
        const v = parseFloat(vals[k]);
        return isNaN(v) ? null : v;
    };
    // Waypoint target altitude is logged as absolute GPS altitude in cm, ground
    // referenced. Convert cm -> metres directly (no home offset, so it shares
    // the ground datum the plane is launched from).
    const toAltM = (cm) => (cm == null ? 0 : cm / 100);
    const addMarker = (latDeg, lonDeg, text, color, heightM, altCm) => {
        const m = degToMeters(latDeg, lonDeg);
        const sprite = makeTextSprite(text, color, heightM);
        // float above the target altitude by half the glyph height so it reads clearly in the air
        sprite.position.set(m.x, toAltM(altCm) + heightM * 0.6, m.z);
        markersGroup.add(sprite);
        return sprite;
    };

    // Waypoints: read from the first rows that carry values (early in the log).
    // Each WP uses its own fixed target altitude (GPS_wp_N_alt).
    const wpDrawn = new Set();
    for (const row of out) {
        const vals = row._raw;
        if (!vals) continue;
        for (let i = 0; i < 15; i++) {
            if (wpDrawn.has(i)) continue;
            const lat = num(vals, wpLat[i]), lon = num(vals, wpLon[i]);
            if (lat != null && lon != null && (lat !== 0 || lon !== 0)) {
                const altCm = num(vals, wpAlt[i]);
                addMarker(lat / 1e7, lon / 1e7, String(i), "#ffd166", 4, altCm);
                wpDrawn.add(i);
            }
        }
        if (wpDrawn.size === 15) break;
    }

    // Rescue points A / B: capture their (static) GPS position. Coordinates may
    // be logged as 0 until the point is first touched, so fall back to home when
    // no non-zero coordinate is ever seen. The sprite is shown/hidden per-frame
    // by updateABMarkers based on whether a live altitude is present.
    for (const row of out) {
        const vals = row._raw;
        if (!vals) continue;
        const aLat = num(vals, iALat), aLon = num(vals, iALon);
        if (abFirstSeen.a === null) abFirstSeen.a = { latDeg: 0, lonDeg: 0 };
        if (aLat != null && aLat !== 0) abFirstSeen.a.latDeg = aLat / 1e7;
        if (aLon != null && aLon !== 0) abFirstSeen.a.lonDeg = aLon / 1e7;
        const bLat = num(vals, iBLat), bLon = num(vals, iBLon);
        if (abFirstSeen.b === null) abFirstSeen.b = { latDeg: 0, lonDeg: 0 };
        if (bLat != null && bLat !== 0) abFirstSeen.b.latDeg = bLat / 1e7;
        if (bLon != null && bLon !== 0) abFirstSeen.b.lonDeg = bLon / 1e7;
    }

    const total = wpDrawn.size + (abFirstSeen.a ? 1 : 0) + (abFirstSeen.b ? 1 : 0);
    console.log(`Markers: ${wpDrawn.size} waypoints, A=${!!abFirstSeen.a}, B=${!!abFirstSeen.b}`);
    console.log(`[AB debug] iALat=${iALat} iALon=${iALon} iAAlt=${iAAlt} iBLat=${iBLat} iBLon=${iBLon} iBAlt=${iBAlt}`);
    console.log(`[AB debug] A pos=`, abFirstSeen.a, `B pos=`, abFirstSeen.b);
    return total;
}

// Per-frame update for the dynamic A/B markers. `fr` is the interpolated frame,
// which already carries the live A/B rescue altitude (fr.aAlt / fr.bAlt, in cm).
// The sprite is created lazily the first time the point's altitude is non-zero,
// then raised to the current altitude every frame.
function updateABMarkers(fr) {
    if (!fr) return;
    for (const point of ["a", "b"]) {
        const seen = abFirstSeen[point];
        if (!seen) continue;
        const altCm = point === "a" ? (fr.aAlt || 0) : (fr.bAlt || 0);
        let entry = abMarker[point];
        if (!entry) {
            const m = degToMeters(seen.latDeg, seen.lonDeg);
            const sprite = makeTextSprite(point.toUpperCase(), "#ff3b3b", 5);
            sprite.position.set(m.x, 0, m.z);
            sprite.visible = altCm !== 0;
            markersGroup.add(sprite);
            entry = abMarker[point] = { sprite, latDeg: seen.latDeg, lonDeg: seen.lonDeg };
        }
        entry.sprite.visible = altCm !== 0;
        const m = degToMeters(seen.latDeg, seen.lonDeg);
        entry.sprite.position.set(m.x, (altCm / 100) + 5 * 0.6, m.z);
    }
}

// read a raw value from a CSV row using a field index (guard for missing field)
function numRaw(vals, k) {
    if (k < 0 || vals == null) return null;
    const v = parseFloat(vals[k]);
    return isNaN(v) ? null : v;
}

// ---------------------------------------------------------------------------
// Blackbox CSV parsing
// ---------------------------------------------------------------------------
let frames = [];     // { t, x, y, z, roll, pitch, yaw, throttle }
let startTime = 0, endTime = 0;
let homeLat = null, homeLon = null, homeAlt = 0;
let homeAsl = 0;       // initial ASL (m), ground-reference zero point
let hasGps = false;

function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter((l) => l.trim().length);
    // find header line (contains loopIteration or time)
    let headerIdx = -1;
    for (let i = 0; i < lines.length; i++) {
        if (/"?loopIteration"?/.test(lines[i]) || /"time"/.test(lines[i])) { headerIdx = i; break; }
    }
    if (headerIdx < 0) throw new Error("CSV header not found");

    const headers = splitCSVLine(lines[headerIdx]);
    const idx = (name) => headers.findIndex((h) => h.replace(/^"|"$/g, "") === name);
    const iLat = idx("GPS_coord[0]");
    const iLon = idx("GPS_coord[1]");
    const iRoll = idx("heading[0]");
    const iPitch = idx("heading[1]");
    const iYaw = idx("heading[2]");
    const iThr = idx("throttle");
    const iRcThr = idx("rcCommand[3]");
    const iVelN = idx("GPS_velned[0]");
    const iVelE = idx("GPS_velned[1]");
    const iAlt = idx("GPS_altitude");
    const iBaroAlt = idx("baroAlt");
    const iTime = idx("time");
    const iLoop = idx("loopIteration");
    const iMode = idx("flightModeFlags");

    // Waypoint / rescue-point fields (lat/lon in deg * 1e7, alt in cm)
    const wpLat = [], wpLon = [], wpAlt = [];
    for (let i = 0; i < 15; i++) {
        wpLat.push(idx(`GPS_wp_${i}_lat`));
        wpLon.push(idx(`GPS_wp_${i}_lon`));
        wpAlt.push(idx(`GPS_wp_${i}_alt`));
    }
    const iALat = idx("GPS_A_lat"), iALon = idx("GPS_A_lon"), iAAlt = idx("GPS_A_alt");
    const iBLat = idx("GPS_B_lat"), iBLon = idx("GPS_B_lon"), iBAlt = idx("GPS_B_alt");

    const out = [];
    for (let i = headerIdx + 1; i < lines.length; i++) {
        const vals = splitCSVLine(lines[i]);
        if (vals.length < headers.length) continue;
        const num = (k) => {
            const v = parseFloat(vals[k]);
            return isNaN(v) ? null : v;
        };
        const loopIter = iLoop >= 0 ? num(iLoop) : -1;
        // Skip first frame (loopIteration 0) which often contains NaN values
        if (loopIter === 0) continue;
        const t = iTime >= 0 ? num(iTime) : (iLoop >= 0 ? num(iLoop) : out.length);
        if (t == null) continue;
        out.push({
            _raw: vals,
            t,
            lat: iLat >= 0 ? num(iLat) : null,
            lon: iLon >= 0 ? num(iLon) : null,
            roll: iRoll >= 0 ? num(iRoll) : 0,
            pitch: iPitch >= 0 ? num(iPitch) : 0,
            yaw: iYaw >= 0 ? num(iYaw) : 0,
            throttle: (iThr >= 0 ? num(iThr) : (iRcThr >= 0 ? num(iRcThr) : 0)) || 0,
            alt: iAlt >= 0 ? num(iAlt) : 0,
            baroAlt: iBaroAlt >= 0 ? num(iBaroAlt) : 0,
            gpsAlt: iAlt >= 0 ? num(iAlt) : 0,
            velN: iVelN >= 0 ? num(iVelN) : 0,
            velE: iVelE >= 0 ? num(iVelE) : 0,
        });
    }
    return {
        out, headers,
        wpLat, wpLon, wpAlt, iALat, iALon, iAAlt, iBLat, iBLon, iBAlt, iAlt, iMode,
    };
}

function splitCSVLine(line) {
    // simple CSV split (quoted fields may contain commas)
    const res = [];
    let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') q = !q;
        else if (c === "," && !q) { res.push(cur); cur = ""; }
        else cur += c;
    }
    res.push(cur);
    return res.map((s) => s.replace(/^"|"$/g, ""));
}

// GPS (deg * 1e7) -> meters relative to home. 1 deg lat ~ 111320 m.
// The log may be recorded at 500Hz while GPS is only updated at 10Hz.  Build
// a real 50Hz playback timeline and interpolate GPS between actual GPS fixes.
const PLAYBACK_HZ = 50;
const PLAYBACK_STEP_US = 1e6 / PLAYBACK_HZ;
let sourceRows = [];
let gpsFixes = [];

function validGpsRow(row) {
    return row.lat != null && row.lon != null && Number.isFinite(row.lat) && Number.isFinite(row.lon);
}

function interpolateRowsAt(rows, t) {
    if (!rows.length) return null;
    if (t <= rows[0].t) return rows[0];
    if (t >= rows[rows.length - 1].t) return rows[rows.length - 1];
    let lo = 0, hi = rows.length - 1;
    while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (rows[mid].t < t) lo = mid; else hi = mid;
    }
    const a = rows[lo], b = rows[hi];
    const f = (t - a.t) / (b.t - a.t || 1);
    return {
        t,
        roll: a.roll + shortestAngleDiff(b.roll, a.roll) * f,
        pitch: a.pitch + shortestAngleDiff(b.pitch, a.pitch) * f,
        yaw: a.yaw + shortestAngleDiff(b.yaw, a.yaw) * f,
        throttle: a.throttle + (b.throttle - a.throttle) * f,
        velN: a.velN + (b.velN - a.velN) * f,
        velE: a.velE + (b.velE - a.velE) * f,
        baroAlt: a.baroAlt + (b.baroAlt - a.baroAlt) * f,
        gpsAlt: a.gpsAlt + (b.gpsAlt - a.gpsAlt) * f,
    };
}

function interpolateGpsAt(t) {
    if (!gpsFixes.length) return null;
    if (t <= gpsFixes[0].t) return gpsFixes[0];
    if (t >= gpsFixes[gpsFixes.length - 1].t) return gpsFixes[gpsFixes.length - 1];
    let lo = 0, hi = gpsFixes.length - 1;
    while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (gpsFixes[mid].t < t) lo = mid; else hi = mid;
    }
    const a = gpsFixes[lo], b = gpsFixes[hi];
    const f = (t - a.t) / (b.t - a.t || 1);
    return {
        lat: a.lat + (b.lat - a.lat) * f,
        lon: a.lon + (b.lon - a.lon) * f,
        gpsAlt: a.gpsAlt + (b.gpsAlt - a.gpsAlt) * f,
    };
}

function buildFrames(data) {
    const { out, iAAlt, iBAlt, iMode } = data;
    sourceRows = out.slice().sort((a, b) => a.t - b.t);

    // Interpolated A/B rescue altitude (cm) at time t, read from the raw rows.
    // A/B coordinates are static, only the altitude varies over the log.
    const rawAbAt = (t, k) => {
        if (k < 0 || !sourceRows.length) return 0;
        let lo = 0, hi = sourceRows.length - 1;
        if (t <= sourceRows[0].t) lo = hi = 0;
        else if (t >= sourceRows[hi].t) lo = hi = hi;
        else { while (hi - lo > 1) { const m = (lo + hi) >> 1; if (sourceRows[m].t < t) lo = m; else hi = m; } }
        const pick = (i) => { const v = sourceRows[i]._raw ? parseFloat(sourceRows[i]._raw[k]) : NaN; return isNaN(v) ? 0 : v; };
        const a = pick(lo), b = pick(hi);
        const f = (t - sourceRows[lo].t) / ((sourceRows[hi].t - sourceRows[lo].t) || 1);
        return a + (b - a) * (hi === lo ? 0 : f);
    };
    frames = [];
    hasGps = sourceRows.some(validGpsRow);

    // flightModeFlags: bit 0 = ARM. Anything beyond pure ARM means assisted/auto mode.
    const rawModeAt = (t) => {
        if (iMode < 0 || !sourceRows.length) return 0;
        let lo = 0, hi = sourceRows.length - 1;
        if (t <= sourceRows[0].t) lo = hi = 0;
        else if (t >= sourceRows[hi].t) lo = hi = hi;
        else { while (hi - lo > 1) { const m = (lo + hi) >> 1; if (sourceRows[m].t < t) lo = m; else hi = m; } }
        const pick = (i) => {
            const raw = sourceRows[i]._raw ? String(sourceRows[i]._raw[iMode] ?? "").trim() : "";
            if (!raw || raw === "NaN") return 0;
            const v = /^0x/i.test(raw) ? parseInt(raw, 16) : parseFloat(raw);
            return isNaN(v) ? 0 : (v | 0);
        };
        return pick(lo);
    };

    // Keep only actual GPS fixes. Repeated 500Hz GPS rows are not useful
    // keyframes and would collapse the interpolation interval to 2ms.
    gpsFixes = [];
    for (const row of sourceRows) {
        if (!validGpsRow(row)) continue;
        const previous = gpsFixes[gpsFixes.length - 1];
        if (!previous || row.lat !== previous.lat || row.lon !== previous.lon || row.gpsAlt !== previous.gpsAlt) {
            gpsFixes.push({ t: row.t, lat: row.lat, lon: row.lon, gpsAlt: row.gpsAlt ?? 0 });
        }
    }

    const first = gpsFixes[0];
    if (first) {
        homeLat = first.lat / 1e7;
        homeLon = first.lon / 1e7;
        console.log("Home position:", homeLat, homeLon, "GPS fixes:", gpsFixes.length);
    }
    const firstAsl = gpsFixes.find((f) => Number.isFinite(f.gpsAlt) && f.gpsAlt !== 0);
    homeAsl = firstAsl ? firstAsl.gpsAlt / 10 : 0;

    const firstTime = sourceRows[0]?.t ?? 0;
    const lastTime = sourceRows[sourceRows.length - 1]?.t ?? firstTime;
    startTime = firstTime;
    endTime = lastTime;

    // Generate exactly one frame every 20ms. Attitude/throttle/etc. are also
    // sampled on this timeline, while GPS is interpolated from real fixes.
    for (let t = startTime; t <= endTime + 0.5; t += PLAYBACK_STEP_US) {
        const row = interpolateRowsAt(sourceRows, Math.min(t, endTime));
        if (!row) continue;
        const gps = interpolateGpsAt(Math.min(t, endTime));
        const gpsAltM = gps ? (gps.gpsAlt || 0) / 10 : (row.gpsAlt || 0) / 10;
        const lat = gps ? gps.lat / 1e7 : homeLat;
        const lon = gps ? gps.lon / 1e7 : homeLon;
        const dLat = (lat - homeLat) * 111320;
        const dLon = (lon - homeLon) * 111320 * Math.cos((homeLat * Math.PI) / 180);
        frames.push({
            t: Math.min(t, endTime), x: dLon, z: -dLat,
            alt: gpsAltM - homeAsl,
            roll: row.roll, pitch: row.pitch, yaw: row.yaw, throttle: row.throttle,
            vx: row.velE, vz: -row.velN,
            baroAltM: gpsAltM, gpsAltM,
            aAlt: rawAbAt(Math.min(t, endTime), iAAlt),
            bAlt: rawAbAt(Math.min(t, endTime), iBAlt),
            mode: rawModeAt(Math.min(t, endTime)),
        });
    }
    if (frames.length) {
        startTime = frames[0].t;
        endTime = frames[frames.length - 1].t;
    }
}

// Playback

let playing = false;
let playT = 0;          // current time (in CSV time units)
let lastPlayWall = 0;

const seek = document.getElementById("seek");
const timeLabel = document.getElementById("timeLabel");
const statusEl = document.getElementById("status");
const playBtn = document.getElementById("playBtn");
const playBtn2 = document.getElementById("playBtn2");
const yawBtn = document.getElementById("yawBtn");
const fullScreenBtn = document.getElementById("fullScreenBtn");

// Shortest angular path for wrap-around (e.g. 2π -> 0 should interpolate forward, not backward).
function shortestAngleDiff(target, current) {
    let d = (target - current) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
}

function frameAt(t) {
    if (!frames.length) return null;
    if (t <= frames[0].t) return frames[0];
    if (t >= frames[frames.length - 1].t) return frames[frames.length - 1];
    // binary search
    let lo = 0, hi = frames.length - 1;
    while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (frames[mid].t < t) lo = mid; else hi = mid;
    }
    const a = frames[lo], b = frames[hi];
    const f = (t - a.t) / (b.t - a.t || 1);
    return {
        x: a.x + (b.x - a.x) * f,
        z: a.z + (b.z - a.z) * f,
        roll: a.roll + shortestAngleDiff(b.roll, a.roll) * f,
        pitch: a.pitch + shortestAngleDiff(b.pitch, a.pitch) * f,
        yaw: a.yaw + shortestAngleDiff(b.yaw, a.yaw) * f,
        throttle: a.throttle + (b.throttle - a.throttle) * f,
        alt: a.alt + (b.alt - a.alt) * f,
        baroAltM: a.baroAltM + (b.baroAltM - a.baroAltM) * f,
        gpsAltM: a.gpsAltM + (b.gpsAltM - a.gpsAltM) * f,
        aAlt: a.aAlt + (b.aAlt - a.aAlt) * f,
        bAlt: a.bAlt + (b.bAlt - a.bAlt) * f,
        mode: a.mode,
    };
}

let prevPos = null;
let dbgCount = 0;
const hudAltRel = document.getElementById("hudAltRel");
const hudAltAsl = document.getElementById("hudAltAsl");
const hudRaw = document.getElementById("hudRaw");
const hudHome = document.getElementById("hudHome");
const hudPos = document.getElementById("hudPos");

// ---------------------------------------------------------------------------
// Contrail: wingtip particle trail
// White = manual flight (ARM only), Pink = assisted/auto (anything else)
// ---------------------------------------------------------------------------
const WING_HALF_SPAN = 2.2; // approx half wing width in model units (scale 0.75)
const CONTRAIL_COUNT = 120; // max particles per side
const CONTRAIL_LIFE = 3.6; // seconds (2x trail length)
const CONTRAIL_SIZE = 0.6; // metres
const contrailGroup = new THREE.Group();
scene.add(contrailGroup);
const contrailLeft = [];
const contrailRight = [];
let contrailAccum = 0;

function spawnContrail(worldPos, side) {
    const pool = side === "left" ? contrailLeft : contrailRight;
    const geom = new THREE.PlaneGeometry(CONTRAIL_SIZE, CONTRAIL_SIZE);
    // Use the current trail color (updates with flight mode); defaults to white.
    const mat = new THREE.MeshBasicMaterial({
        color: contrailGroup.userData.color || 0xffffff, transparent: true, opacity: 0.7, depthWrite: false, side: THREE.DoubleSide,
    });
    const sprite = new THREE.Mesh(geom, mat);
    sprite.position.copy(worldPos);
    sprite.lookAt(camera.position);
    sprite.userData.life = CONTRAIL_LIFE;
    sprite.userData.maxLife = CONTRAIL_LIFE;
    contrailGroup.add(sprite);
    pool.push(sprite);
}

function updateContrail(dt, color) {
    contrailAccum += dt;
    for (const side of ["left", "right"]) {
        const pool = side === "left" ? contrailLeft : contrailRight;
        for (let i = pool.length - 1; i >= 0; i--) {
            const p = pool[i];
            p.userData.life -= dt;
            p.material.opacity = Math.max(0, p.userData.life / p.userData.maxLife) * 0.7;
            p.scale.setScalar(Math.max(0.01, p.userData.life / p.userData.maxLife));
            if (p.userData.life <= 0) {
                contrailGroup.remove(p);
                p.geometry.dispose();
                p.material.dispose();
                pool.splice(i, 1);
            }
        }
    }
    // trim excess
    for (const side of ["left", "right"]) {
        const pool = side === "left" ? contrailLeft : contrailRight;
        while (pool.length > CONTRAIL_COUNT) {
            const old = pool.shift();
            contrailGroup.remove(old);
            old.geometry.dispose();
            old.material.dispose();
        }
    }
    // set color for next spawns
    contrailGroup.userData.color = color;
}

function setContrailColor(fr) {
    const mode = (fr && fr.mode != null) ? (fr.mode | 0) : 0;
    const isAuto = (mode & ~1) !== 0; // anything beyond pure ARM
    const color = isAuto ? 0xff99cc : 0xffffff; // pink or white
    if (contrailGroup.userData.color !== color) {
        contrailGroup.userData.color = color;
        for (const side of ["left", "right"]) {
            const pool = side === "left" ? contrailLeft : contrailRight;
            for (const p of pool) p.material.color.setHex(color);
        }
    }
}

function clearContrail() {
    for (const side of ["left", "right"]) {
        const pool = side === "left" ? contrailLeft : contrailRight;
        while (pool.length) {
            const p = pool.pop();
            contrailGroup.remove(p);
            p.geometry.dispose();
            p.material.dispose();
        }
    }
    contrailGroup.userData.color = null;
    contrailAccum = 0;
}

function applyFrame(fr, t) {
    if (!airplane || !fr) return;
    airplane.position.x = fr.x;
    airplane.position.z = fr.z;
    const altRel = (fr.alt || 0) * 1;
    airplane.position.y = altRel + 1.5;

    hudAltRel.textContent = altRel.toFixed(1);
    hudAltAsl.textContent = (fr.gpsAltM || 0).toFixed(0);
    hudRaw.textContent = ((fr.gpsAltM || 0) * 10).toFixed(0);
    hudHome.textContent = (homeAsl * 10).toFixed(0);

    airplane.rotation.order = 'YXZ';
    airplane.rotation.set(fr.pitch * -1, fr.yaw * -1 + yawOffset, fr.roll * -1, 'YXZ');

    prevPos = { x: fr.x, z: fr.z };

    // dynamic A/B markers track the live (per-frame) rescue altitude
    updateABMarkers(fr);

    // contrail: spawn wingtip particles when in air
    if (airplane && (fr.alt || 0) > 0.5) {
        const localLeft = new THREE.Vector3(-WING_HALF_SPAN, 0.2, 0);
        const localRight = new THREE.Vector3(WING_HALF_SPAN, 0.2, 0);
        airplane.localToWorld(localLeft);
        airplane.localToWorld(localRight);
        if (contrailAccum >= 0.075) {
            spawnContrail(localLeft, "left");
            spawnContrail(localRight, "right");
            contrailAccum = 0;
        }
        setContrailColor(fr);
    }
    updateContrail(0.016, contrailGroup.userData.color || 0xffffff);

    // [AB debug] log first few frames + altitude changes
    if (!window.__abDbg) window.__abDbg = { n: 0, lastA: null, lastB: null };
    const d = window.__abDbg;
    if (d.n < 5 || (fr.aAlt || 0) !== d.lastA || (fr.bAlt || 0) !== d.lastB) {
        d.n++;
        d.lastA = fr.aAlt || 0; d.lastB = fr.bAlt || 0;
        console.log(`[AB frame] aAlt=${Math.round(fr.aAlt || 0)} bAlt=${Math.round(fr.bAlt || 0)} Avis=${abMarker.a ? abMarker.a.sprite.visible : 'none'} Bvis=${abMarker.b ? abMarker.b.sprite.visible : 'none'}`);
    }
}

function updatePropellers(dt, throttle) {
    const maxRpm = 400;
    const speed = 20 + Math.min(1, Math.max(0, throttle)) * maxRpm;
    propAngle += speed * dt;
    for (const p of propellers) p.rotation.y = propAngle;
}

function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? "⏸ Pause" : "▶ Play";
    playBtn2.textContent = p ? "⏸" : "▶";
    if (p) lastPlayWall = performance.now();
}

playBtn.onclick = () => setPlaying(!playing);
playBtn2.onclick = () => setPlaying(!playing);
fullScreenBtn.onclick = () => {
    if (document.fullscreenElement) {
        document.exitFullscreen();
        fullScreenBtn.textContent = "⛶ Full Screen";
    } else {
        document.documentElement.requestFullscreen();
        fullScreenBtn.textContent = "⛶ Exit Full Screen";
    }
};
document.addEventListener("fullscreenchange", () => {
    fullScreenBtn.textContent = document.fullscreenElement ? "⛶ Exit Full Screen" : "⛶ Full Screen";
});

yawBtn.onclick = () => {
    yawOffset += Math.PI / 2;
    if (!frames.length) return;
    const fr = frameAt(playT);
    applyFrame(fr, playT);
};

seek.oninput = () => {
    if (!frames.length) return;
    const frac = seek.value / 1000;
    playT = startTime + (endTime - startTime) * frac;
    prevPos = null;
    setPlaying(false);
    const fr = frameAt(playT);
    applyFrame(fr, playT);
    timeLabel.textContent = ((playT - startTime) / 1e6).toFixed(1) + "s";
};

document.getElementById("resetViewBtn").onclick = () => {
    camera.position.copy(CAM_HOME);
    controls.target.set(0, 2, 0);
    camTargetY = 2;
};

// ---------------------------------------------------------------------------
// File loading
// ---------------------------------------------------------------------------
const fileInput = document.getElementById("fileInput");
fileInput.onchange = (e) => loadFile(e.target.files[0]);

function loadFile(file) {
    if (!file) return;
    // Fully reset playback state before loading a new file so a previous
    // log can't leak its orientation/timing into this one.
    playing = false;
    playT = 0;
    lastPlayWall = performance.now();
    lastTs = 0;
    camTargetY = 2;
    controls.target.set(0, 2, 0);
    loadAirplane(); // (re)load model fresh each time
    clearContrail();
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const data = parseCSV(reader.result);
            const { out } = data;
            if (!out.length) throw new Error("No data rows found");
            buildFrames(data);
            const markerCount = buildMarkers(data);
            playT = startTime;
            seek.value = 0;
            const fr = frameAt(playT);
            applyFrame(fr, playT);
            statusEl.textContent = `Loaded: ${frames.length} frames (${PLAYBACK_HZ}Hz), GPS ${hasGps ? `interpolated from ${gpsFixes.length} fixes` : "unavailable"}` + (markerCount ? `, ${markerCount} markers` : "");
            timeLabel.textContent = "0.0s";
            setPlaying(true);
        } catch (err) {
            console.error(err);
            statusEl.textContent = "Parse failed: " + err.message;
        }
    };
    reader.readAsText(file);
}

// Drag & drop
const drop = document.getElementById("drop");
window.addEventListener("dragover", (e) => { e.preventDefault(); drop.style.display = "flex"; });
window.addEventListener("dragleave", () => { drop.style.display = "none"; });
window.addEventListener("drop", (e) => {
    e.preventDefault(); drop.style.display = "none";
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
function animate(ts) {
    requestAnimationFrame(animate);
    const dt = lastTs ? (ts - lastTs) / 1000 : 0;
    lastTs = ts;

    if (playing && frames.length) {
        // advance in CSV time units (scaled: 1x realtime, time is in microseconds)
        const wallDt = (ts - lastPlayWall) / 1000;
        lastPlayWall = ts;
        playT += wallDt * 1e6; // microseconds per real second
        if (playT >= endTime) { playT = endTime; setPlaying(false); }
        const frac = (playT - startTime) / (endTime - startTime || 1);
        seek.value = Math.max(0, Math.min(1000, frac * 1000));
        const fr = frameAt(playT);
        applyFrame(fr, playT);
        // Camera follows the plane horizontally, but tracks altitude only very
        // gently and ignores small height changes to avoid vertical jitter.
        if (airplane) {
            const tx = airplane.position.x;
            const tz = airplane.position.z;
            let dy = airplane.position.y - camTargetY;
            if (Math.abs(dy) < 0.5) dy = 0;            // ignore small altitude changes
            const ty = camTargetY + dy * 0.01;          // very slow vertical follow
            camTargetY = ty;
            controls.target.lerp(new THREE.Vector3(tx, ty, tz), 0.25);
        }
        timeLabel.textContent = ((playT - startTime) / 1e6).toFixed(1) + "s";
    }

    // propeller spin uses last applied throttle if available
    const thr = frames.length ? (frameAt(playT)?.throttle || 0) : 0;
    updatePropellers(dt, thr);

    controls.update();
    renderer.clear();
    renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
